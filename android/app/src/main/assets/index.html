    <title>Spcc</title>
    <style>
/* Spcc — dual theme (Warm Grove: Grove #3F4F3A, Olive #6B8F71, Fern #A3C9A8, Cream #F7F4EF, Soil #1C1917). Follows prefers-color-scheme (Android WebView day/night). No in-app toggle. */
:root {
  color-scheme: light dark;
  --grove: #3F4F3A;
  --olive: #6B8F71;
  --fern: #A3C9A8;
  --cream: #F7F4EF;
  --soil: #1C1917;
  --primary: #3F4F3A;
  --on-primary: #F7F4EF;
  --primary-container: #A3C9A8;
  --on-primary-container: #1C1917;
  --surface: #F7F4EF;
  --card: #ffffff;
  --card-border: #E4DED3;
  --ink: #1C1917;
  --muted: #5E5A52;
  --danger: #a3362b;
  --on-danger: #F7F4EF;
  --amber: #8a5a00;
  --amber-bg: #fff4dc;
  --cta: var(--primary);
  --card-blur: none;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.05);
  --mark-glow: 0 0 0 0 transparent;
  --panel: #ffffff;
  --panel-border: #D9DDD4;
  --brand-ink: #3F4F3A;
  --trust-bg: #E9EFE6;
  --trust-border: #C9D8C6;
  --trust-ink: #2E3A2A;
  --chip-bg: #EEF2EB;
  --chip-border: transparent;
  --chip-ring: none;
  --chip-selected-bg: var(--fern);
  --chip-selected-fg: var(--soil);
  --focus-ring: 0 0 0 3px rgba(163, 201, 168, 0.85);
  --snackbar-bg: #1C1917;
  --snackbar-fg: #F7F4EF;
  --sheet-bg: #ffffff;
  --sticky-bg: var(--card);
  --radius-card: 16px;
  --radius-btn: 16px;
  --radius-sheet: 28px;
  --pad: 14px;
  --touch: 48px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: linear-gradient(180deg, #1C1917 0%, #0F1410 100%);
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --ink: #F7F4EF;
    --muted: #B5B0A6;
    --primary-container: rgba(107, 143, 113, 0.30);
    --on-primary-container: #A3C9A8;
    --danger: #ff8a7a;
    --on-danger: #1C1917;
    --amber: #ffcf70;
    --amber-bg: rgba(255, 191, 64, 0.12);
    --cta: linear-gradient(135deg, #6B8F71 0%, #3F4F3A 100%);
    --card-blur: blur(16px) saturate(140%);
    --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    --mark-glow: 0 0 18px rgba(163, 201, 168, 0.55);
    --panel: rgba(255, 255, 255, 0.06);
    --panel-border: rgba(255, 255, 255, 0.12);
    --brand-ink: #F7F4EF;
    --trust-bg: rgba(107, 143, 113, 0.14);
    --trust-border: rgba(163, 201, 168, 0.22);
    --trust-ink: #C9E0CC;
    --chip-bg: rgba(255, 255, 255, 0.06);
    --chip-border: rgba(255, 255, 255, 0.06);
    --chip-ring: inset 0 0 0 1px rgba(163, 201, 168, 0.4);
    --chip-selected-bg: var(--olive);
    --chip-selected-fg: var(--soil);
    --primary: #3F4F3A;
    --snackbar-bg: #F7F4EF;
    --snackbar-fg: #1C1917;
    --sheet-bg: linear-gradient(180deg, #262420, #1A1816);
    --sticky-bg: rgba(28, 25, 23, 0.82);
  }
}
* { box-sizing: border-box; }
html, body, #app { height: 100%; height: 100dvh; margin: 0; }
html { overscroll-behavior: none; }
body {
  background: var(--surface);
  background-attachment: fixed;
  color: var(--ink);
  font: 16px/1.45 Roboto, "Noto Sans", system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}
button, input { font: inherit; color: inherit; }
.app {
  height: 100%;
  max-width: 28rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.shell {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) var(--pad) 0;
  overflow: hidden;
}
.chrome { flex: none; display: flex; flex-direction: column; gap: 10px; }
.pane {
  flex: 1;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--card-border) transparent;
}
.pane::-webkit-scrollbar { width: 4px; height: 4px; }
.pane::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
.pane::-webkit-scrollbar-track { background: transparent; }
.appbar { display: flex; align-items: center; gap: 8px; }
.lockup { display: flex; align-items: center; min-width: 0; }
.mark { flex: none; display: block; width: 48px; height: 48px; border-radius: 14px; overflow: hidden; position: relative; z-index: 2; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16), var(--mark-glow); }
.mark svg, .mark img { display: block; width: 100%; height: 100%; }
.lockup-panel { margin-left: -12px; padding: 8px 16px 8px 24px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; z-index: 1; min-width: 0; backdrop-filter: var(--card-blur); }
.lockup-title { margin: 0; font-size: 1.125rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.2px; color: var(--brand-ink); }
.lockup-sub { margin: 2px 0 0; font-size: 0.75rem; line-height: 1.2; color: var(--muted); white-space: nowrap; }
.appbar .icon-btn { margin-left: auto; }
.title-large { font-size: 1.375rem; font-weight: 500; margin: 0; }
.label-large { font-size: 0.875rem; font-weight: 600; margin: 0; }
.rail { list-style: none; display: flex; gap: 8px; margin: 0; padding: 0; }
.pill { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--card-border); color: var(--muted); font-size: 0.8125rem; }
.pill.done { color: var(--ink); }
.pill.active { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; font-weight: 600; }

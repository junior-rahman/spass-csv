    <style>
/* Spcc — dual theme (Warm Grove: Grove #3F4F3A, Olive #6B8F71, Fern #A3C9A8, Cream #F7F4EF, Soil #1C1917). Follows prefers-color-scheme (Android WebView day/night). No in-app toggle. */
:root {
  color-scheme: light dark;
  --primary: #3F4F3A;
  --on-primary: #F7F4EF;
  --primary-container: #A3C9A8;
  --on-primary-container: #1C1917;
  --surface: #F7F4EF;
  --card: #ffffff;
  --card-border: #E4DED3;
  --ink: #1C1917;
  --muted: #5E5A52;
  --danger: #a3362b;
  --amber: #8a5a00;
  --amber-bg: #fff4dc;
  --cta: var(--primary);
  --card-blur: none;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.05);
  --mark-glow: 0 0 0 0 transparent;
  --panel: #ffffff;
  --panel-border: #D9DDD4;
  --brand-ink: #3F4F3A;
  --trust-bg: #E9EFE6;
  --trust-border: #C9D8C6;
  --trust-ink: #2E3A2A;
  --chip-bg: #EEF2EB;
  --chip-border: transparent;
  --chip-ring: none;
  --radius-card: 24px;
  --radius-btn: 20px;
  --radius-sheet: 28px;
  --pad: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: linear-gradient(180deg, #1C1917 0%, #0F1410 100%);
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --ink: #F7F4EF;
    --muted: #B5B0A6;
    --primary-container: rgba(107, 143, 113, 0.30);
    --on-primary-container: #A3C9A8;
    --danger: #ff8a7a;
    --amber: #ffcf70;
    --amber-bg: rgba(255, 191, 64, 0.12);
    --cta: linear-gradient(135deg, #6B8F71 0%, #3F4F3A 100%);
    --card-blur: blur(16px) saturate(140%);
    --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    --mark-glow: 0 0 18px rgba(163, 201, 168, 0.55);
    --panel: rgba(255, 255, 255, 0.06);
    --panel-border: rgba(255, 255, 255, 0.12);
    --brand-ink: #F7F4EF;
    --trust-bg: rgba(107, 143, 113, 0.14);
    --trust-border: rgba(163, 201, 168, 0.22);
    --trust-ink: #C9E0CC;
    --chip-bg: rgba(255, 255, 255, 0.06);
    --chip-border: rgba(255, 255, 255, 0.06);
    --chip-ring: inset 0 0 0 1px rgba(163, 201, 168, 0.4);
    --primary: #3F4F3A;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--surface); background-attachment: fixed; color: var(--ink); font: 16px/1.5 Roboto, "Noto Sans", system-ui, sans-serif; }
button, input { font: inherit; color: inherit; }
.shell { max-width: 32rem; margin: 0 auto; padding: max(var(--pad), env(safe-area-inset-top)) var(--pad) calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: var(--pad); }
.appbar { display: flex; align-items: center; gap: 8px; }
.lockup { display: flex; align-items: center; min-width: 0; }
.mark { flex: none; display: block; width: 48px; height: 48px; border-radius: 14px; overflow: hidden; position: relative; z-index: 2; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16), var(--mark-glow); }
.mark svg { display: block; width: 100%; height: 100%; }
.lockup-panel { margin-left: -12px; padding: 8px 16px 8px 24px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; z-index: 1; min-width: 0; backdrop-filter: var(--card-blur); }
.lockup-title { margin: 0; font-size: 1.125rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.2px; color: var(--brand-ink); }
.lockup-sub { margin: 2px 0 0; font-size: 0.75rem; line-height: 1.2; color: var(--muted); white-space: nowrap; }
.appbar .icon-btn { margin-left: auto; }
.title-large { font-size: 1.375rem; font-weight: 500; margin: 0; }
.label-large { font-size: 0.875rem; font-weight: 600; margin: 0; }
.rail { list-style: none; display: flex; gap: 8px; margin: 0; padding: 0; }
.pill { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--card-border); color: var(--muted); font-size: 0.8125rem; }
.pill.done { color: var(--ink); }
.pill.active { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; font-weight: 600; }
.trust { display: flex; gap: 8px; align-items: center; margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--trust-bg); border: 1px solid var(--trust-border); color: var(--trust-ink); font-size: 0.8125rem; font-weight: 500; }
.trust .icon, .trust .icon svg { width: 16px; height: 16px; }
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-card); padding: var(--pad); display: flex; flex-direction: column; gap: 8px; box-shadow: var(--card-shadow); backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur); }
.field-row { display: flex; gap: 8px; }
.field-row input, .search, .site-input { flex: 1; width: 100%; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--card-border); background: transparent; }
.helper, .muted { color: var(--muted); font-size: 0.875rem; margin: 0; }
.error { color: var(--danger); font-size: 0.875rem; margin: 0; }
.filename, .site { margin: 0; font-size: 0.875rem; word-break: break-all; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 0.875rem; margin: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border-radius: var(--radius-btn); border: 1px solid transparent; cursor: pointer; font-weight: 600; }
.btn.filled { background: var(--cta); color: var(--on-primary); }
.btn.outline { background: transparent; border-color: var(--card-border); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn { background: none; border: 0; padding: 8px; border-radius: 50%; cursor: pointer; }
.icon { display: inline-block; width: 20px; height: 20px; vertical-align: middle; }
.icon svg { width: 20px; height: 20px; display: block; fill: currentColor; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip { min-height: 40px; border-radius: 12px; border: 1px solid var(--chip-border); background: var(--chip-bg); color: var(--trust-ink); font-size: 0.875rem; font-weight: 600; cursor: pointer; }
.chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: var(--chip-ring); }
.counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.count { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 8px; text-align: center; display: flex; flex-direction: column; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.login { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 12px var(--pad); backdrop-filter: var(--card-blur); }
.login-head { display: flex; justify-content: space-between; align-items: center; }
.login .site-input + .helper { color: var(--amber); }
.login:has(.site-input) { border-color: var(--amber); background: var(--amber-bg); }
.extras { display: flex; flex-wrap: wrap; gap: 8px; }
.reminder { display: flex; gap: 8px; color: var(--amber); background: var(--amber-bg); padding: 12px; border-radius: 16px; margin: 0; }
.sticky { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px var(--pad) max(12px, env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--card-border); box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08); backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur); }
.sticky .btn { flex: 1; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 32rem; background: var(--card); color: var(--ink); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 12px 18px max(22px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--card-border); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12); }
.handle { width: 36px; height: 4px; border-radius: 2px; background: var(--card-border); margin: 0 auto 4px; }
@media (prefers-color-scheme: dark) { .sheet { background: linear-gradient(180deg, #262420, #1A1816); } .sticky { background: rgba(28, 25, 23, 0.82); } }
.sheet p { margin: 0; }
.strong { font-weight: 600; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; }
.snackbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; background: #1C1917; color: #F7F4EF; padding: 12px 16px; border-radius: 12px; max-width: 90vw; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .pill { transition: background 150ms ease, opacity 150ms ease; } }
